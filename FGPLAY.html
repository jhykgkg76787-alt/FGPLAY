<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FG PLAY</title>
<style>
body{background:#000;color:white;font-family:Arial, Helvetica, sans-serif;margin:0;padding:0;}
header{padding:20px 5%;font-size:1.5rem;font-weight:900;color:#00b3ff;display:flex;justify-content:space-between;align-items:center;}
#userMenu{position:relative;}
#userMenu img{width:50px;height:50px;border-radius:50%;cursor:pointer;}
#menuDropdown{display:none;position:absolute;right:0;top:60px;background:#1a1a1a;color:#fff;padding:10px;border-radius:8px;min-width:150px;text-align:left;z-index:10;}
#menuDropdown p{margin:5px 0;}
#menuDropdown button{width:100%;background:#00b3ff;color:#000;cursor:pointer;}
.section{padding:20px 5%;}
.section h2{margin-bottom:15px;}
.movies{display:flex;gap:15px;overflow-x:auto;scroll-behavior:smooth;}
.movies::-webkit-scrollbar{display:none;}
.card{min-width:180px;height:270px;border-radius:8px;overflow:hidden;cursor:pointer;position:relative;transition:0.3s;}
.card img{width:100%;height:100%;object-fit:cover;}
.card:hover{transform:scale(1.08);}
.card-title{position:absolute;bottom:0;width:100%;background:linear-gradient(to top, rgba(0,0,0,0.9), transparent);padding:10px;font-size:0.9rem;}
footer{text-align:center;padding:30px 10px;color:#777;border-top:1px solid #222;font-size:0.9rem;margin-top:40px;}
</style>
</head>
<body>

<header>
  FG PLAY
  <div id="userMenu">
    <img id="profilePic" src="" alt="Perfil" onclick="toggleMenu()">
    <div id="menuDropdown">
      <p id="menuNome"></p>
      <button onclick="logout()">Sair</button>
    </div>
  </div>
</header>

<section class="section">
  <h2>Séries</h2>
  <div class="movies">
    <a href="SUPERMEN 1941.html" class="card">
      <img src="https://github.com/user-attachments/assets/c176da8e-d1b9-4c14-973d-460abf2b08d0">
      <div class="card-title">SUPERMAN (1941)</div>
    </a>
  </div>
</section>

<footer>© 2026 FG PLAY</footer>

<script>
// Mostrar dados do usuário logado
const usuario = localStorage.getItem("usuarioLogado");
if(!usuario) window.location.href = "login.html";

let usuarios = JSON.parse(localStorage.getItem("usuarios")) || {};
const userData = usuarios[usuario];

document.getElementById("profilePic").src = userData.foto;
document.getElementById("menuNome").innerText = "Usuário: " + usuario;

// Menu dropdown
function toggleMenu(){
  const menu = document.getElementById("menuDropdown");
  menu.style.display = (menu.style.display === "block") ? "none" : "block";
}

// Logout
function logout(){
  localStorage.removeItem("usuarioLogado");
  window.location.href = "login.html";
}
</script>

</body>
</html>
