<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FG PLAY | Premium Streaming</title>
<style>
:root{--primary:#00b3ff;--bg:#0b0b0b;--card-bg:#141414;--text:#fff;}
body.light{--bg:#f2f2f2;--text:#111;--card-bg:#fff;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:var(--bg);color:var(--text);overflow-x:hidden;transition:.3s;}
.hidden{display:none !important;}
button{cursor:pointer;border:none;transition:.3s;}
.profile-selector{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#000;}
.profiles-list{display:flex;gap:30px;flex-wrap:wrap;justify-content:center;}
.profile-item{text-align:center;width:140px;cursor:pointer;position:relative;}
.profile-avatar{width:130px;height:130px;border-radius:12px;object-fit:cover;background:#222;border:3px solid transparent;}
.profile-item:hover .profile-avatar{border-color:var(--primary);transform:scale(1.05);}
.delete-btn{position:absolute;top:-10px;right:-5px;background:red;color:white;border-radius:50%;width:25px;height:25px;font-size:12px;}
header{display:flex;justify-content:space-between;align-items:center;padding:15px 5%;background:rgba(0,0,0,.95);position:fixed;top:0;width:100%;z-index:100;backdrop-filter:blur(10px);gap:15px;}
.logo{color:var(--primary);font-weight:900;font-size:1.5rem;cursor:pointer;}
.search-box{flex-grow:1;max-width:400px;}
.search-box input{width:100%;padding:10px 20px;border-radius:20px;border:1px solid #333;background:#1a1a1a;color:white;}
.section{padding:100px 5% 0;}
.movies{display:flex;gap:15px;overflow-x:auto;padding-bottom:20px;scroll-behavior:smooth;}
.card{min-width:170px;height:250px;border-radius:8px;overflow:hidden;position:relative;cursor:pointer;background:var(--card-bg);transition:.3s;box-shadow:0 4px 10px rgba(0,0,0,.3);}
.card:hover{transform:scale(1.05);z-index:10;}
.card img{width:100%;height:100%;object-fit:cover;}
.card-title{position:absolute;bottom:0;width:100%;padding:10px;background:linear-gradient(transparent,#000);color:#fff;font-size:.8rem;text-align:center;}
.hero{height:60vh;background-size:cover;background-position:center;position:relative;display:flex;align-items:center;padding:0 5%;}
.hero::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(to top,var(--bg),transparent);}
.hero-content{position:relative;z-index:2;max-width:600px;}
.btn-main{background:var(--primary);color:white;padding:12px 25px;border-radius:5px;font-weight:bold;margin-right:10px;}
.btn-sec{background:rgba(255,255,255,.2);color:var(--text);padding:12px 25px;border-radius:5px;backdrop-filter:blur(5px);}
.playerPage{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:3000;}
.playerPage iframe{width:100%;height:100%;border:none;}
.close-player{position:absolute;top:20px;left:20px;z-index:3100;background:var(--primary);color:white;padding:10px 20px;border-radius:30px;}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);display:flex;justify-content:center;align-items:center;z-index:2000;}
.modal-box{background:#181818;padding:30px;border-radius:15px;text-align:center;width:320px;}
.modal-box input{width:100%;padding:10px;margin:10px 0;border-radius:5px;border:none;}
</style>
</head>
<body>

<div id="profilePage" class="profile-selector">
    <h1 style="color:white;margin-bottom:30px;">Quem está assistindo?</h1>
    <div class="profiles-list" id="listaPerfis"></div>
</div>

<div id="createModal" class="modal hidden">
    <div class="modal-box">
        <h2 style="color:white">Novo Perfil</h2>
        <input type="text" id="newName" placeholder="Nome do perfil">
        <input type="file" id="newFile" accept="image/*">
        <button class="btn-main" onclick="salvarPerfil()" style="width:100%;margin-top:10px;">CRIAR</button>
        <button onclick="fecharModal()" style="background:none;color:gray;margin-top:10px;">Cancelar</button>
    </div>
</div>

<div id="site" class="hidden">
    <header>
        <div class="logo" onclick="voltarHome()">FG PLAY</div>
        <div class="search-box">
            <input type="text" id="inputBusca" placeholder="Buscar..." oninput="filtrar()">
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
            <button onclick="document.body.classList.toggle('light')" style="background:none;font-size:1.2rem;">🌓</button>
            <img id="userImg" style="width:35px;height:35px;border-radius:50%;border:2px solid var(--primary);cursor:pointer" onclick="logout()">
        </div>
    </header>

    <main id="homeContent">
        <section id="sectionBusca" class="section hidden">
            <h2>Resultados</h2>
            <div class="movies" id="resBusca"></div>
        </section>

        <section class="section">
            <h2 id="tAssistindo" class="hidden">Continuar Assistindo</h2>
            <div class="movies" id="listaAssistindo"></div>
        </section>

        <section class="section">
            <h2 id="tLista" class="hidden">Minha Lista</h2>
            <div class="movies" id="listaFavoritos"></div>
        </section>

        <section class="section">
            <h2>Séries</h2>
            <div class="movies" id="catalogo"></div>
        </section>
    </main>

    <div id="detalhesPage" class="hidden" style="padding-top:70px">
        <section class="hero" id="heroBg">
            <div class="hero-content">
                <h1 id="heroTitle" style="font-size:3rem;margin-bottom:20px">Título</h1>
                <button class="btn-main" onclick="assistirAgora()">▶ ASSISTIR AGORA</button>
                <button class="btn-sec" onclick="toggleFav()">⭐ MINHA LISTA</button>
                <button class="btn-sec" onclick="verTrailer()" style="margin-left:10px">🎬 TRAILER</button>
                <button onclick="voltarHome()" style="display:block;margin-top:30px;background:none;color:var(--primary)">← Voltar para o início</button>
            </div>
        </section>
    </div>
</div>

<div id="playerPage" class="playerPage hidden">
    <button class="close-player" onclick="fecharPlayer()">✕ Fechar Player</button>
    <iframe id="videoPlayer" allow="autoplay; fullscreen"></iframe>
</div>

<script>
const CATALOGO=[{id:"superman1",titulo:"Superman (1941)",imagem:"https://github.com/user-attachments/assets/c176da8e-d1b9-4c14-973d-460abf2b08d0",url:"https://drive.google.com/file/d/1_3ibKA4cETvCy1RfFPgdjgpI3nVQG_G5/preview",trailer:"https://www.youtube.com/embed/SaGseDvQ2RI"}];

let userAtivo=null;
let filmeAtual=null;
let fotoBase64="";

function renderPerfis(){
  const users=JSON.parse(localStorage.getItem("fg_users"))||{};
  const container=document.getElementById("listaPerfis");
  container.innerHTML="";
  Object.keys(users).forEach(nome=>{
    const div=document.createElement("div");
    div.className="profile-item";
    div.innerHTML=`
      <button class="delete-btn" onclick="event.stopPropagation();deletarUser('${nome}')">✕</button>
      <img src="${users[nome].foto||'https://via.placeholder.com/130'}" class="profile-avatar">
      <p style="color:white;margin-top:10px">${nome}</p>`;
    div.addEventListener("click",()=>logar(nome));
    container.appendChild(div);
  });
  const add=document.createElement("div");
  add.className="profile-item";
  add.innerHTML=`<div class="profile-avatar" style="display:flex;justify-content:center;align-items:center;font-size:3rem;color:#444;border:2px dashed #333">+</div><p style="color:white;margin-top:10px">Adicionar</p>`;
  add.addEventListener("click",()=>document.getElementById("createModal").classList.remove("hidden"));
  container.appendChild(add);
}

function salvarPerfil(){
  const nome=document.getElementById("newName").value.trim();
  if(!nome) return alert("Digite um nome");
  let users=JSON.parse(localStorage.getItem("fg_users"))||{};
  // Cada perfil mantém seu histórico e favoritos independentes
  users[nome]={foto:fotoBase64,favoritos:[],assistindo:[]};
  localStorage.setItem("fg_users",JSON.stringify(users));
  fotoBase64="";
  fecharModal();
  renderPerfis();
}

function logar(nome){
  userAtivo=nome;
  localStorage.setItem("fg_sessao",nome);
  document.getElementById("profilePage").classList.add("hidden");
  document.getElementById("site").classList.remove("hidden");
  const users=JSON.parse(localStorage.getItem("fg_users"));
  document.getElementById("userImg").src=users[nome].foto||"https://via.placeholder.com/35";
  renderHome();
}

function renderHome(){
  const users=JSON.parse(localStorage.getItem("fg_users"));
  const dados=users[userAtivo];
  document.getElementById("catalogo").innerHTML=CATALOGO.map(f=>`<div class="card" onclick="abrirDetalhes('${f.id}')"><img src="${f.imagem}"><div class="card-title">${f.titulo}</div></div>`).join('');
  const fv=dados.favoritos||[];
  document.getElementById("listaFavoritos").innerHTML=fv.map(f=>`<div class="card" onclick="abrirDetalhes('${f.id}')"><img src="${f.imagem}"><div class="card-title">${f.titulo}</div></div>`).join('');
  document.getElementById("tLista").classList.toggle("hidden", fv.length===0);
  const as=dados.assistindo||[];
  document.getElementById("listaAssistindo").innerHTML=as.map(f=>`<div class="card" onclick="abrirDetalhes('${f.id}')"><img src="${f.imagem}"><div class="card-title">${f.titulo}</div></div>`).join('');
  document.getElementById("tAssistindo").classList.toggle("hidden", as.length===0);
}

function abrirDetalhes(id){
  filmeAtual=CATALOGO.find(f=>f.id===id);
  document.getElementById("homeContent").classList.add("hidden");
  document.getElementById("detalhesPage").classList.remove("hidden");
  document.getElementById("heroTitle").innerText=filmeAtual.titulo;
  document.getElementById("heroBg").style.backgroundImage=`url(${filmeAtual.imagem})`;
  window.scrollTo(0,0);
}

function assistirAgora(){
  const users=JSON.parse(localStorage.getItem("fg_users"));
  let hist=users[userAtivo].assistindo||[];
  hist=hist.filter(x=>x.id!==filmeAtual.id);
  hist.unshift(filmeAtual);
  users[userAtivo].assistindo=hist.slice(0,10);
  localStorage.setItem("fg_users",JSON.stringify(users));
  document.getElementById("videoPlayer").src=filmeAtual.url;
  document.getElementById("playerPage").classList.remove("hidden");
}

function toggleFav(){
  const users=JSON.parse(localStorage.getItem("fg_users"));
  let favs=users[userAtivo].favoritos||[];
  const existe=favs.find(x=>x.id===filmeAtual.id);
  if(existe) favs=favs.filter(x=>x.id!==filmeAtual.id);
  else favs.push(filmeAtual);
  users[userAtivo].favoritos=favs;
  localStorage.setItem("fg_users",JSON.stringify(users));
  alert("Lista atualizada!");
  renderHome();
}

function filtrar(){
  const t=document.getElementById("inputBusca").value.toLowerCase();
  const container=document.getElementById("sectionBusca");
  if(t.length>0){
    container.classList.remove("hidden");
    const res=CATALOGO.filter(f=>f.titulo.toLowerCase().includes(t));
    document.getElementById("resBusca").innerHTML=res.map(f=>`<div class="card" onclick="abrirDetalhes('${f.id}')"><img src="${f.imagem}"><div class="card-title">${f.titulo}</div></div>`).join('');
  } else container.classList.add("hidden");
}

function verTrailer(){
  document.getElementById("videoPlayer").src=filmeAtual.trailer;
  document.getElementById("playerPage").classList.remove("hidden");
}

function fecharPlayer(){
  document.getElementById("playerPage").classList.add("hidden");
  document.getElementById("videoPlayer").src="";
}

function voltarHome(){
  document.getElementById("homeContent").classList.remove("hidden");
  document.getElementById("detalhesPage").classList.add("hidden");
  document.getElementById("inputBusca").value="";
  document.getElementById("sectionBusca").classList.add("hidden");
  renderHome();
}

function deletarUser(nome){
  if(confirm("Excluir perfil?")){
    let users=JSON.parse(localStorage.getItem("fg_users"));
    delete users[nome];
    localStorage.setItem("fg_users",JSON.stringify(users));
    renderPerfis();
  }
}

function fecharModal(){document.getElementById("createModal").classList.add("hidden");}
function logout(){localStorage.removeItem("fg_sessao");location.reload();}

document.getElementById("newFile").addEventListener("change",function(){
  const reader=new FileReader();
  reader.onload=e=>fotoBase64=e.target.result;
  reader.readAsDataURL(this.files[0]);
});

window.addEventListener("load",()=>{
  const s=localStorage.getItem("fg_sessao");
  if(s) logar(s);
  else renderPerfis();
});
</script>

</body>
</html>
