<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FG PLAY</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial;background:#0f0f0f;color:#fff;}
button{cursor:pointer;border:none;border-radius:5px;padding:10px 15px;font-weight:bold;}
input{padding:10px;border-radius:5px;border:none;margin:5px 0;width:100%;}
.hidden{display:none;}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 5%;
background:#000;
}

.logo{color:#00b3ff;font-weight:900;font-size:1.3rem;}

.profile{
display:flex;
align-items:center;
gap:10px;
}

.profile img{
width:40px;
height:40px;
border-radius:50%;
object-fit:cover;
}

.section{padding:30px 5%;}

.movies{
display:flex;
gap:15px;
overflow-x:auto;
}

.card{
min-width:180px;
height:270px;
border-radius:8px;
overflow:hidden;
position:relative;
cursor:pointer;
transition:0.3s;
}

.card img{
width:100%;
height:100%;
object-fit:cover;
}

.card:hover{transform:scale(1.05);}

.card-title{
position:absolute;
bottom:0;
width:100%;
padding:10px;
background:linear-gradient(to top,rgba(0,0,0,0.9),transparent);
font-size:0.9rem;
}

/* HERO FILME */
.hero{
position:relative;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
padding:0 5%;
background:
linear-gradient(to top,#0f0f0f 10%,transparent 60%),
url('https://github.com/user-attachments/assets/c176da8e-d1b9-4c14-973d-460abf2b08d0') center/cover no-repeat;
}

.hero h1{font-size:3rem;margin-bottom:20px;}

.back-btn{
position:absolute;
top:20px;
left:20px;
background:rgba(0,0,0,0.6);
color:#fff;
font-size:18px;
padding:8px 12px;
border-radius:50%;
}

.hero-buttons{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.hero-buttons button{
background:#fff;
color:#000;
}

.login-container{
max-width:300px;
margin:100px auto;
text-align:center;
}

#preview{
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
background:#222;
margin-bottom:10px;
}

footer{
text-align:center;
padding:20px;
color:#777;
border-top:1px solid #222;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage" class="login-container">
<h1>FG PLAY</h1>
<input type="text" id="usuario" placeholder="Usuário">
<input type="password" id="senha" placeholder="Senha">
<input type="file" id="foto" accept="image/*">
<img id="preview">
<button onclick="entrar()">Entrar / Cadastrar</button>
</div>

<!-- HOME -->
<div id="homePage" class="hidden">

<header>
<div class="logo">FG PLAY</div>
<div class="profile">
<img id="fotoPerfil">
<button onclick="logout()">Sair</button>
</div>
</header>

<section class="section">
<h2>Minha Lista</h2>
<div class="movies" id="minhaLista"></div>
</section>

<section class="section">
<h2>Séries</h2>
<div class="movies">
<div class="card" onclick="abrirFilme()">
<img src="https://github.com/user-attachments/assets/c176da8e-d1b9-4c14-973d-460abf2b08d0">
<div class="card-title">SUPERMAN (1941)</div>
</div>
</div>
</section>

</div>

<!-- FILME -->
<div id="filmePage" class="hidden">
<section class="hero">

<button class="back-btn" onclick="voltarHome()">←</button>

<h1>SUPERMAN (1941)</h1>

<div class="hero-buttons">
<button onclick="favoritar()">⭐ Favoritar</button>
<button onclick="playFilme()">▶ Play</button>
<button onclick="verTrailer()">🎬 Trailer</button>
</div>

</section>
</div>

<footer>© 2026 FG PLAY</footer>

<script>
const FILME = {
id:"superman1941",
titulo:"SUPERMAN (1941)",
imagem:"https://github.com/user-attachments/assets/c176da8e-d1b9-4c14-973d-460abf2b08d0"
};

// Preview imagem
document.getElementById("foto").addEventListener("change", e=>{
const file=e.target.files[0];
if(file){
const reader=new FileReader();
reader.onload=ev=>{
document.getElementById("preview").src=ev.target.result;
}
reader.readAsDataURL(file);
}
});

// Login
function entrar(){
let usuario=document.getElementById("usuario").value.trim();
let senha=document.getElementById("senha").value.trim();
let foto=document.getElementById("preview").src;

if(!usuario||!senha||!foto){alert("Preencha tudo");return;}

let usuarios=JSON.parse(localStorage.getItem("usuarios"))||{};

if(!usuarios[usuario]){
usuarios[usuario]={senha:senha,foto:foto,favoritos:[]};
}else{
if(usuarios[usuario].senha!==senha){alert("Senha incorreta");return;}
}

localStorage.setItem("usuarios",JSON.stringify(usuarios));
localStorage.setItem("usuarioLogado",usuario);
mostrarHome();
}

function mostrarHome(){
document.getElementById("loginPage").classList.add("hidden");
document.getElementById("homePage").classList.remove("hidden");
document.getElementById("filmePage").classList.add("hidden");

let usuario=localStorage.getItem("usuarioLogado");
let usuarios=JSON.parse(localStorage.getItem("usuarios"));
document.getElementById("fotoPerfil").src=usuarios[usuario].foto;

carregarLista();
}

function favoritar(){
let usuario=localStorage.getItem("usuarioLogado");
let usuarios=JSON.parse(localStorage.getItem("usuarios"));

if(!usuarios[usuario].favoritos.some(f=>f.id===FILME.id)){
usuarios[usuario].favoritos.push(FILME);
localStorage.setItem("usuarios",JSON.stringify(usuarios));
alert("Adicionado à Minha Lista!");
}else{
alert("Já está na lista");
}
}

function carregarLista(){
let usuario=localStorage.getItem("usuarioLogado");
let usuarios=JSON.parse(localStorage.getItem("usuarios"));
let container=document.getElementById("minhaLista");
container.innerHTML="";

usuarios[usuario].favoritos.forEach(f=>{
container.innerHTML+=`
<div class="card" onclick="abrirFilme()">
<img src="${f.imagem}">
<div class="card-title">${f.titulo}</div>
</div>`;
});
}

function abrirFilme(){
document.getElementById("homePage").classList.add("hidden");
document.getElementById("filmePage").classList.remove("hidden");
}

function voltarHome(){
mostrarHome();
}

function logout(){
localStorage.removeItem("usuarioLogado");
location.reload();
}

function playFilme(){
window.open("https://drive.google.com/file/d/1_3ibKA4cETvCy1RfFPgdjgpI3nVQG_G5/preview","_blank");
}

function verTrailer(){
window.open("https://youtu.be/SaGseDvQ2RI?si=VSn9fv3rE-zfjfgH","_blank");
}

window.onload=()=>{
if(localStorage.getItem("usuarioLogado")){
mostrarHome();
}
}
</script>

</body>
</html>
