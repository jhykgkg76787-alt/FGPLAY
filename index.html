<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FG PLAY</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial;background:#0f0f0f;color:#fff;}
button{cursor:pointer;border:none;border-radius:5px;padding:10px 15px;font-weight:bold;}
input{padding:10px;border-radius:5px;border:none;margin:5px 0;width:100%;}
.hidden{display:none;}
iframe{border:none;}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 5%;
background:#000;
}

.logo{color:#00b3ff;font-weight:900;font-size:1.3rem;}

.profile{
display:flex;
align-items:center;
gap:10px;
}

.profile img{
width:40px;
height:40px;
border-radius:50%;
object-fit:cover;
}

.section{padding:30px 5%;}

.movies{
display:flex;
gap:15px;
overflow-x:auto;
}

.card{
min-width:180px;
height:270px;
border-radius:8px;
overflow:hidden;
position:relative;
cursor:pointer;
transition:0.3s;
}

.card img{
width:100%;
height:100%;
object-fit:cover;
}

.card:hover{transform:scale(1.05);}

.card-title{
position:absolute;
bottom:0;
width:100%;
padding:10px;
background:linear-gradient(to top,rgba(0,0,0,0.9),transparent);
font-size:0.9rem;
}

/* HERO */
.hero{
position:relative;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
padding:0 5%;
background:
linear-gradient(to top,#0f0f0f 10%,transparent 60%),
url('https://github.com/user-attachments/assets/c176da8e-d1b9-4c14-973d-460abf2b08d0') center/cover no-repeat;
}

.hero h1{font-size:3rem;margin-bottom:20px;}

.back-btn{
position:absolute;
top:20px;
left:20px;
background:rgba(0,0,0,0.6);
color:#fff;
font-size:18px;
padding:8px 12px;
border-radius:50%;
}

/* PLAYER */
.playerPage{
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
background:#000;
z-index:999;
}

.player-top{
position:absolute;
top:0;
width:100%;
padding:15px;
background:linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
font-weight:bold;
}

.playerPage iframe{
width:100%;
height:100%;
}

/* LOGIN */
.login-container{
max-width:300px;
margin:100px auto;
text-align:center;
}

#preview{
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
background:#222;
margin-bottom:10px;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage" class="login-container">
<h1>FG PLAY</h1>
<input type="text" id="usuario" placeholder="Usuário">
<input type="password" id="senha" placeholder="Senha">
<input type="file" id="foto" accept="image/*">
<img id="preview">
<button onclick="entrar()">Entrar / Cadastrar</button>
</div>

<!-- HOME -->
<div id="homePage" class="hidden">
<header>
<div class="logo">FG PLAY</div>
<div class="profile">
<img id="fotoPerfil">
<button onclick="logout()">Sair</button>
</div>
</header>

<section class="section">
<h2>Minha Lista</h2>
<div class="movies" id="minhaLista"></div>
</section>

<section class="section">
<h2>Séries</h2>
<div class="movies">
<div class="card" onclick="abrirFilme()">
<img src="https://github.com/user-attachments/assets/c176da8e-d1b9-4c14-973d-460abf2b08d0">
<div class="card-title">SUPERMAN (1941)</div>
</div>
</div>
</section>
</div>

<!-- FILME -->
<div id="filmePage" class="hidden">
<section class="hero">
<button class="back-btn" onclick="voltarHome()">←</button>
<h1>SUPERMAN (1941)</h1>
<div style="display:flex;gap:10px;flex-wrap:wrap;">
<button id="btnFavorito" onclick="favoritar()">⭐ Favoritar</button>
<button onclick="abrirPlayer()">▶ Play</button>
</div>
</section>
</div>

<!-- PLAYER -->
<div id="playerPage" class="playerPage hidden">
<div class="player-top">
<button onclick="fecharPlayer()">← Voltar</button>
SUPERMAN (1941) - T1:E1 O Cientista Louco
</div>
<iframe 
src="https://drive.google.com/file/d/1_3ibKA4cETvCy1RfFPgdjgpI3nVQG_G5/preview"
allow="autoplay"
allowfullscreen>
</iframe>
</div>

<script>
const FILME = {
id:"superman1941",
titulo:"SUPERMAN (1941)",
imagem:"https://github.com/user-attachments/assets/c176da8e-d1b9-4c14-973d-460abf2b08d0"
};

/* FOTO PREVIEW */
document.getElementById("foto").addEventListener("change", e=>{
const file=e.target.files[0];
if(file){
const reader=new FileReader();
reader.onload=ev=>{
document.getElementById("preview").src=ev.target.result;
}
reader.readAsDataURL(file);
}
});

/* LOGIN */
function entrar(){
let usuario=usuario.value.trim();
let senhaInput=senha.value.trim();
let foto=preview.src;

if(!usuario||!senhaInput||!foto){alert("Preencha tudo");return;}

let usuarios=JSON.parse(localStorage.getItem("usuarios"))||{};

if(!usuarios[usuario]){
usuarios[usuario]={senha:senhaInput,foto:foto,favoritos:[]};
}else{
if(usuarios[usuario].senha!==senhaInput){alert("Senha incorreta");return;}
}

localStorage.setItem("usuarios",JSON.stringify(usuarios));
localStorage.setItem("usuarioLogado",usuario);
mostrarHome();
}

function mostrarHome(){
loginPage.classList.add("hidden");
homePage.classList.remove("hidden");
filmePage.classList.add("hidden");
}

function abrirFilme(){
homePage.classList.add("hidden");
filmePage.classList.remove("hidden");
}

function voltarHome(){
mostrarHome();
}

function abrirPlayer(){
playerPage.classList.remove("hidden");
}

function fecharPlayer(){
playerPage.classList.add("hidden");
}

function favoritar(){
let usuario=localStorage.getItem("usuarioLogado");
let usuarios=JSON.parse(localStorage.getItem("usuarios"));

let index=usuarios[usuario].favoritos.findIndex(f=>f.id===FILME.id);

if(index===-1){
usuarios[usuario].favoritos.push(FILME);
alert("Adicionado à Minha Lista!");
}else{
usuarios[usuario].favoritos.splice(index,1);
alert("Removido da Minha Lista!");
}

localStorage.setItem("usuarios",JSON.stringify(usuarios));
}

function logout(){
localStorage.removeItem("usuarioLogado");
location.reload();
}

window.onload=()=>{
if(localStorage.getItem("usuarioLogado")){
mostrarHome();
}
}
</script>

</body>
</html>
