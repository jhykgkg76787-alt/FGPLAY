<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FG PLAY - Login</title>
<style>
body{background:#000;color:white;font-family:Arial, Helvetica, sans-serif;margin:0;padding:0;}
#loginContainer{text-align:center;padding:50px;}
input{display:block;margin:10px auto;padding:10px;width:250px;border-radius:5px;border:none;}
button{padding:10px 20px;margin-top:10px;border:none;border-radius:5px;background:#00b3ff;color:#000;cursor:pointer;font-weight:bold;}
#preview{width:100px;height:100px;border-radius:50%;object-fit:cover;margin-bottom:10px;background:#333;}
</style>
</head>
<body>

<div id="loginContainer">
  <h1>FG PLAY</h1>
  <input type="text" id="usuario" placeholder="Usuário">
  <input type="password" id="senha" placeholder="Senha">
  <input type="file" id="foto" accept="image/*">
  <img id="preview" src="" alt="Preview da Foto">
  <button onclick="Entrar()">Cadastrar / Entrar</button>
</div>

<script>
// Preview da foto
document.getElementById("foto").addEventListener("change", function(e){
  const file = e.target.files[0];
  if(file){
    const reader = new FileReader();
    reader.onload = function(event){
      document.getElementById("preview").src = event.target.result;
    }
    reader.readAsDataURL(file);
  }
});

// Entrar ou Cadastrar
function Entrar(){
  const usuario = document.getElementById("usuario").value.trim();
  const senha = document.getElementById("senha").value.trim();
  const foto = document.getElementById("preview").src;

  if(!usuario || !senha || !foto){
    alert("Preencha todos os campos e adicione uma foto");
    return;
  }

  let usuarios = JSON.parse(localStorage.getItem("usuarios")) || {};
  
  // Se usuário existe, checa senha
  if(usuarios[usuario]){
    if(usuarios[usuario].senha !== senha){
      alert("Senha incorreta!");
      return;
    }
  } else {
    // Novo usuário
    usuarios[usuario] = { senha: senha, foto: foto };
    localStorage.setItem("usuarios", JSON.stringify(usuarios));
  }

  localStorage.setItem("usuarioLogado", usuario);
  // Vai para a página principal
  window.location.href = "main.html";
}

// Auto login
window.addEventListener("load", ()=>{
  const usuario = localStorage.getItem("usuarioLogado");
  if(usuario) window.location.href = "FGPLAY.html";
});
</script>

</body>
</html>
