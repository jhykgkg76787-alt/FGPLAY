<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FG PLAY - Premium</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #0b0b0b; color: #fff; overflow-x: hidden; transition: 0.3s; }
        body.light { background: #f2f2f2; color: #111; }
        .hidden { display: none !important; }
        button { cursor: pointer; border: none; transition: 0.3s; }

        /* LOGIN */
        .login-container {
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #000, #111, #00b3ff33);
        }
        .login-box {
            background: #141414; padding: 40px; border-radius: 12px; width: 90%; max-width: 350px;
            text-align: center; box-shadow: 0 0 40px rgba(0, 179, 255, 0.2);
        }
        .login-box h1 { color: #00b3ff; margin-bottom: 20px; font-weight: 900; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 12px; border: none; border-radius: 6px; background: #222; color: #fff; }
        .login-box button { width: 100%; padding: 12px; background: #00b3ff; color: white; border-radius: 6px; font-weight: bold; }
        #preview { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin: 10px auto; display: none; border: 2px solid #00b3ff; }

        /* HEADER */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 5%; background: rgba(0,0,0,0.9); position: fixed; top: 0; width: 100%; z-index: 100;
            gap: 10px; backdrop-filter: blur(10px);
        }
        .logo { color: #00b3ff; font-weight: 900; font-size: 1.5rem; cursor: pointer; flex-shrink: 0; }
        
        .search-container { flex-grow: 1; max-width: 400px; position: relative; }
        .search-container input {
            width: 100%; padding: 10px 18px; border-radius: 25px; border: 1px solid #333;
            background: #1a1a1a; color: #fff; outline: none; transition: 0.3s;
        }
        .search-container input:focus { border-color: #00b3ff; box-shadow: 0 0 10px rgba(0, 179, 255, 0.3); }

        .header-actions { display: flex; align-items: center; gap: 15px; flex-shrink: 0; }
        .profile-img { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #00b3ff; object-fit: cover; }

        /* HERO / DETALHES */
        .hero {
            height: 60vh; display: flex; flex-direction: column; justify-content: center;
            padding: 0 5%; background-size: cover; background-position: center;
            position: relative;
        }
        .hero::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, #0b0b0b, transparent), linear-gradient(to right, rgba(0,0,0,0.8), transparent);
        }
        .hero-content { position: relative; z-index: 2; max-width: 600px; }
        .hero h1 { font-size: 3rem; margin-bottom: 15px; text-shadow: 2px 2px 10px #000; }
        .hero-btns { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-fav { background: rgba(255,255,255,0.2); color: #fff; padding: 12px 20px; border-radius: 5px; backdrop-filter: blur(5px); font-weight: bold; }
        .btn-back { position: absolute; top: 90px; left: 5%; z-index: 10; background: rgba(0,0,0,0.5); color: #fff; padding: 8px 15px; border-radius: 20px; }

        /* EPISÓDIOS */
        .episodes-section { padding: 20px 5%; }
        .episodes-section h3 { margin-bottom: 20px; border-left: 4px solid #00b3ff; padding-left: 10px; }
        .episode-item {
            background: #1a1a1a; margin-bottom: 10px; padding: 15px; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; transition: 0.3s;
        }
        .episode-item:hover { background: #252525; transform: translateX(10px); color: #00b3ff; }

        /* SEÇÕES HOME */
        .section { padding: 40px 5% 0; transition: 0.5s; }
        .section h2 { margin-bottom: 15px; color: #00b3ff; font-size: 1.3rem; }
        .movies { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 15px; scroll-behavior: smooth; }
        .movies::-webkit-scrollbar { height: 5px; }
        .movies::-webkit-scrollbar-thumb { background: #00b3ff; border-radius: 10px; }
        
        .card {
            min-width: 170px; height: 250px; border-radius: 8px; overflow: hidden;
            position: relative; cursor: pointer; background: #111; transition: 0.3s;
        }
        .card:hover { transform: scale(1.05); z-index: 5; box-shadow: 0 5px 15px rgba(0,0,0,0.8); }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-title {
            position: absolute; bottom: 0; width: 100%; padding: 10px;
            background: linear-gradient(to top, #000, transparent); font-size: 0.8rem; text-align: center;
        }

        /* PLAYER */
        .playerPage { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; }
        .playerPage iframe { width: 100%; height: 100%; border: none; }
        .close-player { position: absolute; top: 20px; left: 20px; z-index: 2100; background: #00b3ff; color: white; padding: 10px 20px; border-radius: 30px; }

        footer { text-align: center; padding: 40px; color: #444; font-size: 0.8rem; }
    </style>
</head>
<body>

<div id="loginPage" class="login-container">
    <div class="login-box">
        <h1>FG PLAY</h1>
        <input type="text" id="usuario" placeholder="Nome de usuário">
        <input type="password" id="senha" placeholder="Senha">
        <input type="file" id="fotoInput" accept="image/*">
        <img id="preview">
        <button onclick="entrar()">ENTRAR / CADASTRAR</button>
    </div>
</div>

<div id="site" class="hidden">
    <header>
        <div class="logo" onclick="limparBuscaEVoltar()">FG PLAY</div>
        
        <div class="search-container">
            <input type="text" id="inputBusca" placeholder="O que vamos assistir hoje?" oninput="gerenciarPesquisa()">
        </div>

        <div class="header-actions">
            <button onclick="document.body.classList.toggle('light')" style="background:none; font-size:1.2rem;">🌙</button>
            <img id="userImg" class="profile-img">
            <button onclick="logout()" style="background:none; color:#ff4444; font-weight:bold;">Sair</button>
        </div>
    </header>

    <main id="homeContent">
        <section id="sectionBusca" class="section hidden" style="padding-top: 100px;">
            <h2 id="titleBusca">Resultados da Pesquisa</h2>
            <div class="movies" id="containerResultados"></div>
            <hr style="border: 0; border-top: 1px solid #222; margin-top: 20px;">
        </section>

        <div id="conteudoNormal">
            <section class="section" style="padding-top: 100px;">
                <h2 id="titleAssistindo" class="hidden">Assistindo</h2>
                <div class="movies" id="assistindoLista"></div>
            </section>

            <section class="section">
                <h2 id="titleLista" class="hidden">Minha Lista</h2>
                <div class="movies" id="minhaLista"></div>
            </section>

            <section class="section">
                <h2>Catálogo Completo</h2>
                <div class="movies" id="catalogo"></div>
            </section>
        </div>
    </main>

    <div id="detalhesPage" class="hidden">
        <button class="btn-back" onclick="voltarHome()">← Voltar</button>
        <section class="hero" id="heroBg">
            <div class="hero-content">
                <h1 id="heroTitle">Título</h1>
                <div class="hero-btns">
                    <button class="btn-fav" id="btnFav" onclick="toggleFavorito()">⭐ Minha Lista</button>
                    <button class="btn-fav" onclick="verTrailer()">🎬 Trailer</button>
                </div>
            </div>
        </section>

        <div class="episodes-section">
            <h3>Temporada 1</h3>
            <div id="listaEpisodios"></div>
        </div>
    </div>

    <footer>© 2026 FG PLAY</footer>
</div>

<div id="playerPage" class="playerPage hidden">
    <button class="close-player" onclick="fecharPlayer()">✕ Fechar Player</button>
    <iframe id="videoPlayer" allow="autoplay; fullscreen"></iframe>
</div>

<script>
    /* BANCO DE DADOS */
    const CATALOGO = [
        {
            id: "superman1941",
            titulo: "SUPERMAN (1941)",
            imagem: "https://github.com/user-attachments/assets/c176da8e-d1b9-4c14-973d-460abf2b08d0",
            trailer: "https://www.youtube.com/embed/SaGseDvQ2RI",
            episodios: [
                { numero: 1, nome: "1. O Cientista Louco", url: "https://drive.google.com/file/d/1_3ibKA4cETvCy1RfFPgdjgpI3nVQG_G5/preview" },
                { numero: 2, nome: "2. Os Monstros Mecânicos", url: "https://drive.google.com/file/d/1_3ibKA4cETvCy1RfFPgdjgpI3nVQG_G5/preview" }
            ]
        }
        // Adicione mais aqui...
    ];

    let filmeSelecionado = null;

    /* LOGIN */
    const fotoInput = document.getElementById("fotoInput");
    const preview = document.getElementById("preview");

    fotoInput.onchange = () => {
        const file = fotoInput.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = e => { preview.src = e.target.result; preview.style.display = "block"; };
            reader.readAsDataURL(file);
        }
    };

    function entrar() {
        const user = document.getElementById("usuario").value.trim();
        const pass = document.getElementById("senha").value.trim();
        if (!user || !pass) return alert("Preencha tudo!");
        let usuarios = JSON.parse(localStorage.getItem("fg_usuarios")) || {};
        if (!usuarios[user]) {
            usuarios[user] = { senha: pass, foto: preview.src || '', favoritos: [], assistindo: [] };
        } else if (usuarios[user].senha !== pass) {
            return alert("Senha incorreta!");
        }
        localStorage.setItem("fg_usuarios", JSON.stringify(usuarios));
        localStorage.setItem("fg_logado", user);
        iniciarApp();
    }

    function iniciarApp() {
        document.getElementById("loginPage").classList.add("hidden");
        document.getElementById("site").classList.remove("hidden");
        const user = localStorage.getItem("fg_logado");
        const usuarios = JSON.parse(localStorage.getItem("fg_usuarios"));
        document.getElementById("userImg").src = usuarios[user].foto || 'https://via.placeholder.com/40';
        renderCatalogoPadrao();
        voltarHome();
    }

    /* LOGICA DE PESQUISA AVANÇADA */
    function gerenciarPesquisa() {
        const termo = document.getElementById("inputBusca").value.toLowerCase();
        const sectionBusca = document.getElementById("sectionBusca");
        const conteudoNormal = document.getElementById("conteudoNormal");
        const containerResultados = document.getElementById("containerResultados");
        const titleBusca = document.getElementById("titleBusca");

        if (termo.length > 0) {
            // Mostra busca e esconde o resto
            sectionBusca.classList.remove("hidden");
            conteudoNormal.classList.add("hidden");

            const filtrados = CATALOGO.filter(item => item.titulo.toLowerCase().includes(termo));
            
            if (filtrados.length > 0) {
                titleBusca.innerText = `Resultados para "${termo}"`;
                containerResultados.innerHTML = filtrados.map(f => `
                    <div class="card" onclick="abrirDetalhes('${f.id}')">
                        <img src="${f.imagem}">
                        <div class="card-title">${f.titulo}</div>
                    </div>
                `).join('');
            } else {
                titleBusca.innerText = "Nenhum resultado encontrado...";
                containerResultados.innerHTML = "";
            }
        } else {
            // Volta ao normal
            sectionBusca.classList.add("hidden");
            conteudoNormal.classList.remove("hidden");
        }
    }

    function limparBuscaEVoltar() {
        document.getElementById("inputBusca").value = "";
        gerenciarPesquisa();
        voltarHome();
    }

    /* RENDERS */
    function renderCatalogoPadrao() {
        document.getElementById("catalogo").innerHTML = CATALOGO.map(f => `
            <div class="card" onclick="abrirDetalhes('${f.id}')">
                <img src="${f.imagem}">
                <div class="card-title">${f.titulo}</div>
            </div>
        `).join('');
    }

    function abrirDetalhes(id) {
        filmeSelecionado = CATALOGO.find(f => f.id === id);
        document.getElementById("homeContent").classList.add("hidden");
        document.getElementById("detalhesPage").classList.remove("hidden");
        document.getElementById("heroTitle").innerText = filmeSelecionado.titulo;
        document.getElementById("heroBg").style.backgroundImage = `url(${filmeSelecionado.imagem})`;

        document.getElementById("listaEpisodios").innerHTML = filmeSelecionado.episodios.map(ep => `
            <div class="episode-item" onclick="playEpisodio(${ep.numero})">
                <strong>${ep.nome}</strong>
                <span>▶</span>
            </div>
        `).join('');
        atualizarBotaoFav();
        window.scrollTo(0,0);
    }

    function playEpisodio(num) {
        const ep = filmeSelecionado.episodios.find(e => e.numero === num);
        registrarAssistindo(ep);
        document.getElementById("videoPlayer").src = ep.url;
        document.getElementById("playerPage").classList.remove("hidden");
    }

    function registrarAssistindo(ep) {
        const user = localStorage.getItem("fg_logado");
        let usuarios = JSON.parse(localStorage.getItem("fg_usuarios"));
        let historico = usuarios[user].assistindo || [];
        const item = { id: filmeSelecionado.id, titulo: `${filmeSelecionado.titulo} - Ep ${ep.numero}`, imagem: filmeSelecionado.imagem };
        historico = historico.filter(h => h.id !== item.id);
        historico.unshift(item);
        if(historico.length > 10) historico.pop();
        usuarios[user].assistindo = historico;
        localStorage.setItem("fg_usuarios", JSON.stringify(usuarios));
    }

    function renderAssistindo() {
        const user = localStorage.getItem("fg_logado");
        const usuarios = JSON.parse(localStorage.getItem("fg_usuarios"));
        const historico = usuarios[user].assistindo || [];
        const container = document.getElementById("assistindoLista");
        if (historico.length > 0) {
            document.getElementById("titleAssistindo").classList.remove("hidden");
            container.innerHTML = historico.map(h => `
                <div class="card" onclick="abrirDetalhes('${h.id}')">
                    <img src="${h.imagem}">
                    <div class="card-title">${h.titulo}</div>
                </div>
            `).join('');
        } else { document.getElementById("titleAssistindo").classList.add("hidden"); }
    }

    function voltarHome() {
        document.getElementById("homeContent").classList.remove("hidden");
        document.getElementById("detalhesPage").classList.add("hidden");
        renderAssistindo();
        renderMinhaLista();
    }

    function toggleFavorito() {
        const user = localStorage.getItem("fg_logado");
        let usuarios = JSON.parse(localStorage.getItem("fg_usuarios"));
        let favs = usuarios[user].favoritos;
        const index = favs.findIndex(f => f.id === filmeSelecionado.id);
        if (index === -1) favs.push(filmeSelecionado);
        else favs.splice(index, 1);
        usuarios[user].favoritos = favs;
        localStorage.setItem("fg_usuarios", JSON.stringify(usuarios));
        atualizarBotaoFav();
    }

    function atualizarBotaoFav() {
        const user = localStorage.getItem("fg_logado");
        const usuarios = JSON.parse(localStorage.getItem("fg_usuarios"));
        const isFav = usuarios[user].favoritos.some(f => f.id === filmeSelecionado.id);
        document.getElementById("btnFav").innerText = isFav ? "✅ Na Minha Lista" : "⭐ Minha Lista";
    }

    function renderMinhaLista() {
        const user = localStorage.getItem("fg_logado");
        const usuarios = JSON.parse(localStorage.getItem("fg_usuarios"));
        const favs = usuarios[user].favoritos || [];
        const container = document.getElementById("minhaLista");
        if (favs.length > 0) {
            document.getElementById("titleLista").classList.remove("hidden");
            container.innerHTML = favs.map(f => `
                <div class="card" onclick="abrirDetalhes('${f.id}')">
                    <img src="${f.imagem}">
                    <div class="card-title">${f.titulo}</div>
                </div>
            `).join('');
        } else { document.getElementById("titleLista").classList.add("hidden"); }
    }

    function fecharPlayer() {
        document.getElementById("playerPage").classList.add("hidden");
        document.getElementById("videoPlayer").src = "";
        voltarHome();
    }

    function verTrailer() {
        document.getElementById("videoPlayer").src = filmeSelecionado.trailer;
        document.getElementById("playerPage").classList.remove("hidden");
    }

    function logout() { localStorage.removeItem("fg_logado"); location.reload(); }

    window.onload = () => { if (localStorage.getItem("fg_logado")) iniciarApp(); }
</script>

</body>
</html>
